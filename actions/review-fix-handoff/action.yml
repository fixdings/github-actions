name: Hand the PR to a person
description: Posts the needs-human comment and label when a fix round needs a workflow change or committed nothing.
inputs:
  round:
    description: The round step's `n`.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        ROUND: ${{ inputs.round }}
        # The file review-fix.yml's prompt tells Claude to write a workflow change to.
        HANDOFF: claude-review-fix-handoff.md
      run: bash "$GITHUB_ACTION_PATH/run.sh"
