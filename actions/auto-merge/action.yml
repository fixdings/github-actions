name: Merge if the review is clean
description: Merges the reviewed commit when its review run ends VERDICT CLEAN, or labels the PR needs-human with one comment saying why not.
inputs:
  sensitive-paths:
    description: The caller's `vars.REVIEW_SENSITIVE_PATHS`; empty means the built-in list.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        REVIEW_WORKFLOW: ${{ github.event.workflow_run.path }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPO_PRIVATE: ${{ github.event.repository.private }}
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        REVIEW_SENSITIVE_PATHS: ${{ inputs.sensitive-paths }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
