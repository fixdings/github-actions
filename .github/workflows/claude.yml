name: Claude Code

# Caller only: the run itself is fixdings/github-actions' reusable-claude.yml.
# Typing "@claude" in a comment is the ONLY way in. `issue_comment` covers both an issue
# and a PR's conversation — GitHub models a PR as an issue — and
# `pull_request_review_comment` adds an inline comment on a diff line. Deliberately no
# `issues`/`pull_request` label trigger and no `pull_request_review`: a run starts because
# someone asked for one in words.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per issue/PR: two at once commit from their own runner's disk, so the second
# silently overwrites the first. `false` because this job commits — never kill it mid-write.
# Limit: a group holds ONE pending run, so a third trigger drops the queued one — which is
# why a run the `if` below will reject must NOT enter the shared group. A workflow-level
# group is taken when the run is CREATED, before any job `if` runs, and the action's own
# tracking comment fires `issue_comment` right back at us — measured on issue #61, that run
# sat pending five minutes inside the real run's group and ended `cancelled`. A per-run
# group lets it skip immediately instead.
concurrency:
  # Uniform indentation on purpose: `>-` folds these into ONE line only while no line is
  # more indented than the first, which is what keeps the group a single expression.
  group: >-
    ${{ github.actor == 'claude[bot]'
    && format('claude-noop-{0}', github.run_id)
    || format('claude-{0}', github.event.issue.number || github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  claude:
    # The ceiling for the called job, which can only narrow it.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: ./.github/workflows/reusable-claude.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
