name: Claude Auto Review with Tracking

# Caller only: the review itself is fixdings/github-actions' reusable-claude-code-review.yml.
# Keep this file's `name:` and path: claude-auto-merge.yml and claude-review-fix.yml match the
# review run by both.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # The ceiling for the called job, which can only narrow it.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    uses: ./.github/workflows/reusable-claude-code-review.yml
    with:
      round-budget: ${{ vars.CLAUDE_CODE_REVIEW_ROUND_BUDGET }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
