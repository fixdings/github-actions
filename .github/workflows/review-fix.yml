name: Claude Review Fix

# Fixes the [blocking] findings of a review round, then lets the next round judge the fix — but
# ONLY on a PR Claude opened itself (claude.yml's `gh pr create` from an issue): author
# `claude[bot]`, head on a `claude/` branch. A person's PR is never touched here, even one Claude
# committed to on request; its author answers its review. The loop ends on CLEAN, or when the
# round reaches the budget (`CLAUDE_CODE_REVIEW_ROUND_BUDGET`, else 3 — the numbers are read from
# the review's own `Round <n> of <budget> · VERDICT: …` line, so this file and the review can
# never disagree), or on a fix round that commits nothing (no push, so no next round) — both
# give the PR the `needs-human` label and one comment.
#
# `workflow_run` for the same reason as claude-auto-merge.yml: it always runs the DEFAULT
# branch's copy of this file, so the PR under review cannot rewrite its own fixer. Unlike the
# gate it does check out the PR head — it has to edit it — which the action's security doc warns
# against for untrusted heads (docs/security.md, "Using this action with pull_request_target or
# workflow_run"). Here the head is a same-repo `claude/` branch written by Claude for someone
# with write access, and the round step proves both before the checkout happens.

#
# Called from a repo's `.github/workflows/claude-review-fix.yml` on `workflow_run`; that caller
# owns the trigger, `run-name`, `concurrency` and the job `permissions` (a called workflow can
# only narrow them). The `github` context is the caller's, so `github.event.workflow_run` below
# is the review run that finished.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  fix:
    # A failed review leaves no verdict to act on (the gate labels it `review-failed`); cancelled
    # and skipped runs were superseded by a push. `pull_requests` lists only same-repo PRs, so a
    # fork never reaches the checkout below.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/claude-code-review.yml' &&
      github.event.workflow_run.pull_requests[0] != null &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # github.token only (the round step's reads, the needs-human label and comment). It does NOT
    # bound Claude: the action mints its own App token, and the commit goes through that.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # This repo's actions/ at the commit of THIS workflow file. `job.workflow_*` names the called
      # workflow where `github.*` names the caller, so the scripts are always the ones this file
      # shipped with — never `@v2`, which floats, nor the caller's checkout. Sparse, non-cone, so
      # no CLAUDE.md or package.json of this repo lands in the job's tree; no credentials, since
      # nothing pushes from it. Not PR code, so it may run before the round step vets the PR.
      # checkout EMPTIES a non-repo workspace, so the PR checkout below is followed by a second one.
      - name: Check out this workflow's actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .fixdings-actions
          sparse-checkout: actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the review round
        id: round
        uses: ./.fixdings-actions/actions/review-fix-round

      - name: Checkout the PR head
        if: steps.round.outputs.fix == 'yes'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Again, as above: the PR checkout emptied the workspace, the first copy with it.
      - name: Check out this workflow's actions again
        if: steps.round.outputs.fix == 'yes'
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .fixdings-actions
          sparse-checkout: actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Out of the PR's own tree: Claude's `git status` stays the PR's, and Grep and Glob skip it.
      - name: Keep the actions checkout out of the PR's tree
        if: steps.round.outputs.fix == 'yes'
        run: echo "/.fixdings-actions/" >> .git/info/exclude

      - name: Fix the blocking findings
        if: steps.round.outputs.fix == 'yes'
        uses: anthropics/claude-code-action@v1
        env:
          # Agent mode commits to the branch this names (src/modes/agent/index.ts: "useful for
          # auto-fix workflows"); without it the file_ops server would target the default branch.
          CLAUDE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review this answers was started by claude[bot]'s own push from round 2 on, and
          # agent mode refuses a bot actor not on this list (src/github/validation/actor.ts).
          allowed_bots: "claude[bot]"
          # Commits through mcp__github_file_ops__commit_files, signed by GitHub, with the App
          # token — so the push starts the next review round, which a GITHUB_TOKEN push would not.
          use_commit_signing: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
            BRANCH: ${{ github.event.workflow_run.head_branch }}
            HEAD SHA: ${{ github.event.workflow_run.head_sha }}
            You opened this pull request. Review round ${{ steps.round.outputs.n }} of ${{ steps.round.outputs.budget }}
            left ${{ steps.round.outputs.blocking }} [blocking] finding(s). The review comment is saved at
            ${{ runner.temp }}/review-round.md — Read it first. Earlier rounds are in the PR conversation
            (gh pr view <PR NUMBER> --comments) and the change is gh pr diff <PR NUMBER>.
            Fix every [blocking] finding, in this one turn. A [non-blocking] one only when its fix is
            small and certain. Change nothing the findings do not ask for. Follow this repository's
            CLAUDE.md, its .claude/rules and the code around each change; run the test suite when the
            repo has one. Two rules hold whatever the repo says: build a shell call as an argv array,
            never by interpolating into a string, and never put a secret in argv or an env var.
            Commit with mcp__github_file_ops__commit_files — ONE commit, message
            fix: address review round ${{ steps.round.outputs.n }} — which pushes to BRANCH and starts the
            next review round. You cannot change anything under .github/workflows: this token may not,
            on purpose. When a [blocking] finding needs such a change, Write the change as a fenced
            diff naming its path, with one line on which finding it answers, to
            claude-review-fix-handoff.md at the repository root — NEVER commit that file — and fix the
            other findings as usual; the next step posts it and hands the PR to a person.
            A finding you cannot or should not fix (it is wrong, or the fix is out of reach) is left
            alone and answered in ONE gh pr comment naming it and why — the next round reads it, and
            a finding still open at the budget goes to a person.
            The next round reads the PR body as your stated intent, so after committing, bring it in
            line with the PR as it now stands: read it (gh pr view <PR NUMBER> --json body) and Write
            the WHOLE new body to claude-review-fix-body.md at the repository root — NEVER commit that
            file; the next step applies it. Change only what your fix made untrue: the description of
            the change, and a Closes #<n> line, which stays only if the PR still fully resolves that
            issue. Keep every other line as it is. Skip the file when nothing in the body went stale.
            Never end the turn waiting for anything: this is a one-shot CI run.
          # Agent mode adds no tools of its own, so the file_ops commit tool is named here. The rest
          # is claude.yml's set minus everything that opens or reaches beyond THIS PR.
          claude_args: |
            --max-turns 90
            --allowedTools "mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(npm test*),Bash(npm run test*),Bash(yarn test*),Bash(yarn run test*),Bash(cat:*),Bash(wc:*),Bash(diff:*),Bash(grep:*),Bash(ls:*),Read,Grep,Glob,Edit,Write"

      # A fix can make the PR body untrue (#471's walk: a fix that reverted the change left "Adds …"
      # and `Closes #483` in place, and the next round flagged it). Claude writes the new body to a
      # file and this step applies it with github.token, so Claude's allowlist gets no `gh pr edit`,
      # which would also reach labels, base branch and state. Before the hand-off below, so a
      # needs-human comment never sits under a stale description.
      - name: Refresh the PR body
        if: ${{ !cancelled() && steps.round.outputs.fix == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          BODY_FILE: claude-review-fix-body.md
        run: |
          [ -s "$BODY_FILE" ] || exit 0
          gh pr edit "$PR" --body-file "$BODY_FILE" || echo "::warning::Could not refresh PR #$PR's body."

      # The actions afresh before any step that runs one after Claude did: the fixer held Edit and
      # Write over the whole tree and ran the PR's tests, either of which could have rewritten a
      # script in the workspace, and a later step would run it with this job's token. Deleted first, so nothing planted in its .git/ (a hook) runs during the
      # checkout. Inline, so nothing in the workspace decides it.
      - name: Remove the actions checkout the run could reach
        if: ${{ !cancelled() && steps.round.outputs.fix == 'yes' }}
        run: rm -rf .fixdings-actions

      - name: Check out this workflow's actions afresh
        if: ${{ !cancelled() && steps.round.outputs.fix == 'yes' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .fixdings-actions
          sparse-checkout: actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Two ways this round ends with a person, both labelled here rather than by Claude, so the
      # hand-off needs no `gh pr edit` in its allowlist. Runs even when the Claude step failed.
      #  - A fix that needs .github/workflows/ — which this unattended run may not write
      #    (claude.yml may: a person starts it) — comes back as a diff for a person to commit.
      #  - No commit at all (every finding declined, a crash, --max-turns): no push means no next
      #    review, so the budget branch above would never run and the PR would sit BLOCKING,
      #    unlabelled, authored by a bot nobody is notified for.
      - name: Hand the PR to a person
        if: ${{ !cancelled() && steps.round.outputs.fix == 'yes' }}
        uses: ./.fixdings-actions/actions/review-fix-handoff
        with:
          round: ${{ steps.round.outputs.n }}
