name: Claude Review Fix
run-name: Claude Review Fix · ${{ github.event.workflow_run.head_sha }}

# Caller only: the fixer itself is fixdings/github-actions' reusable-claude-review-fix.yml.
# `workflow_run` always runs the DEFAULT branch's copy of this file, so the PR under review
# cannot rewrite its own fixer.
on:
  workflow_run:
    # Matched by NAME, which any workflow can claim — the called job's `if` pins the path too.
    workflows: [Claude Auto Review with Tracking]
    types: [completed]

# One fixer per branch, never killed mid-commit. A fix push starts the next review, whose
# completion queues the next fixer here, so they cannot overlap in practice anyway.
concurrency:
  group: claude-review-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    # The ceiling for the called job, which can only narrow it.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/reusable-claude-review-fix.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
